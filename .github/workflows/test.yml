name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies to install — the project is dependency-free by design.
      - name: Verification suite (dataset integrity, model invariants, simulation calibration)
        run: npm test

      - name: Analysis engine reproduces docs/insights.md
        run: npm run analyze

      - name: Bright Data pipeline dry-run (no credentials needed)
        run: npm run scrape:dry
